<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - PUMAVISION</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="formularioInicio">
        <div class="icono-contenedor">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4V6.5z"/></svg>
        </div>
        <h2>BIENVENIDO AL SISTEMA DE CAMARAS</h2>
        
        <div class="campo">
            <label>CORREO</label>
            <input type="email" id="usuario" placeholder="correo@ejemplo.com">
        </div>
        <div class="campo">
            <label>PASSWORD</label>
            <input type="password" id="contrasena" placeholder="********">
        </div>

        <button id="btnIngresar">ENTRAR</button>
        <a href="#" id="recuperar">¿Olvidaste la contraseña?</a>
    </div>
 
    <script src="JS/script.js"></script>
</body>
</html>
